name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    name: Build, notarize, and publish
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main. Run this workflow on the main branch."
          exit 1

      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/milo/Cargo.toml | head -1)"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::Milo $version is already released. Raise the version in crates/milo/Cargo.toml, and run this again."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update Rust
        run: rustup update stable && rustup default stable

      - name: Set up signing
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/milo.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          xcrun notarytool store-credentials milo \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --keychain "$keychain"
          echo "MILO_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build and notarize
        run: scripts/release.sh

      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" target/Milo.dmg \
            --target "$GITHUB_SHA" --title "Milo $VERSION" --generate-notes

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/milo.keychain-db" || true
